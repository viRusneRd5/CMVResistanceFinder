repository_type: pipeline

nf_core_version: 4.0.2

lint:
  files_unchanged:
    - CODE_OF_CONDUCT.md
    - assets/nf-core-cmvresistancefinder_logo_light.png
    - docs/images/nf-core-cmvresistancefinder_logo_light.png
    - docs/images/nf-core-cmvresistancefinder_logo_dark.png
    - .github/ISSUE_TEMPLATE/bug_report.yml
    - .github/PULL_REQUEST_TEMPLATE.md
    - docs/README.md
  nextflow_config:
    - manifest.name
    - manifest.homePage
  multiqc_config:
    - report_comment
  # this pipeline is not on nf-core/configs, so there is no pipeline-specific
  # config to include
  included_configs: false
  files_exist:
    - CODE_OF_CONDUCT.md
    - assets/nf-core-cmvresistancefinder_logo_light.png
    - docs/images/nf-core-cmvresistancefinder_logo_light.png
    - docs/images/nf-core-cmvresistancefinder_logo_dark.png
    - .github/ISSUE_TEMPLATE/config.yml
    - .github/workflows/awstest.yml
    - .github/workflows/awsfulltest.yml
    # this pipeline ships its own CMV reference and does not use nf-core iGenomes
    - conf/igenomes.config
    - conf/igenomes_ignored.config
    # a single bundled test is enough; there is no full-size / AWS megatest
    - conf/test_full.config
    # not an nf-core repo - no dev->master branch protection
    - .github/workflows/branch.yml
    # this pipeline does not send completion emails
    - assets/email_template.html
    - assets/email_template.txt
    - assets/sendmail_template.txt
  # the phenotype database bibtex uses double braces to protect capitalisation,
  # which the template-string check mistakes for Jinja
  template_strings:
    - assets/cmv_resis_db_bibliography.bib

template:
  org: viRusneRd5
  name: CMVResistanceFinder
  description: Identifies cytomegalovirus (CMV) antiviral resistant mutations from
    short- and long-read sequencing data.
  author: Jocelyn Hume
  version: 1.0.0
  force: true
  outdir: .
  skip_features:
    - gpu
  is_nfcore: false
