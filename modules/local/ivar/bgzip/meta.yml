name: "htslib_bgziptabix"
description: "Multi-purpose module to compress, decompress and index files using bgzip
  and tabix."
keywords:
  - compress
  - bgzip
tools:
  - "htslib":
      description: "C library for high-throughput sequencing data formats."
      homepage: "http://www.htslib.org/"
      documentation: "http://www.htslib.org/doc/"
      tool_dev_url: "https://github.com/samtools/htslib"
      doi: "10.1093/gigascience/giab007"
      licence:
        - "MIT"
      identifier: biotools:htslib
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'sample1' ]
    - infile:
        type: file
        description: Input file to compress
        pattern: "*"
        ontologies: []
output:
  output:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'sample1' ]
      - ${outfile}:
          type: file
          description: Compressed output file
          pattern: "*"
          ontologies: []
  versions_htslib:
    - - ${task.process}:
          type: string
          description: The name of the process
      - htslib:
          type: string
          description: The name of the tool
      - bgzip --version | sed '1! d; s/bgzip (htslib) //':
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - htslib:
          type: string
          description: The name of the tool
      - bgzip --version | sed '1! d; s/bgzip (htslib) //':
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@itrujnara"
maintainers:
  - "@itrujnara"
